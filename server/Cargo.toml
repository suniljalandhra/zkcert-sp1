[package]
name = "zkcert-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1.0"
dotenv = "0.15.0"
alloy-primitives = "1.7.3"
zkcert-lib = { path = "../lib" }
zkcert-script = { path = "../script" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
alloy-sol-types = { workspace = true }
rsa = "0.9.10"
