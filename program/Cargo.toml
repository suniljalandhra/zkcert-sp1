[workspace]

[package]
version = "0.1.0"
name = "zkcert-program"
edition = "2021"

[dependencies]
alloy-sol-types = "1.7.3"
sp1-zkvm = { version = "6.10.0" }
zkcert-lib = { path = "../lib" }

# SP1 precompile-accelerated forks (tags pinned to our SP1 version, see docs/DECISIONS.md).
[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-6.10.0" }
rsa = { git = "https://github.com/sp1-patches/RustCrypto-RSA", tag = "patch-0.9.6-sp1-6.10.0" }
crypto-bigint = { git = "https://github.com/sp1-patches/RustCrypto-bigint", tag = "patch-0.5.5-sp1-6.10.0" }
tiny-keccak = { git = "https://github.com/sp1-patches/tiny-keccak", tag = "patch-2.0.2-sp1-6.10.0" }
