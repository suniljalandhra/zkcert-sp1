[package]
name = "zkcert-verifier"
version = "0.1.0"
edition = "2021"

# Verifies zkCert's SP1 "compressed" proofs. Pure Rust without sp1-sdk, so the same code runs in the
# CLI and, compiled to WebAssembly (`--features wasm`, see web/build-wasm.sh), in the browser.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
wasm = ["dep:wasm-bindgen", "dep:getrandom"]

[dependencies]
sp1-verifier = "=6.10.0"
sp1-primitives = "=6.10.0"
slop-algebra = "=6.10.0"
bincode = "1.3"
wasm-bindgen = { version = "0.2.130", optional = true }
# A transitive dependency (rand_core) needs a randomness source on wasm32; verification never uses it.
getrandom = { version = "0.2", features = ["js"], optional = true }
